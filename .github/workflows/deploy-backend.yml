name: 🦀 Build & Test Backend Rust

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    name: Build & Test Rust
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 💾 Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 🔍 Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: 📎 Clippy linting
        working-directory: backend
        run: cargo clippy -- -D warnings

      - name: 🧪 Run tests
        working-directory: backend
        run: cargo test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sijaga_test

  # Railway auto-deploy via GitHub integration (tidak butuh step manual)
  # Railway akan deteksi push ke main dan trigger rebuild otomatis
  notify:
    name: Notifikasi Status
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: ✅ Build berhasil
        if: needs.test.result == 'success'
        run: echo "Backend build & test berhasil! Railway akan auto-deploy."

      - name: ❌ Build gagal
        if: needs.test.result == 'failure'
        run: |
          echo "Build atau test gagal. Railway tidak akan deploy."
          exit 1
