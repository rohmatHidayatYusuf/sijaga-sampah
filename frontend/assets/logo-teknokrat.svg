<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="teknoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="teknoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Lingkaran Luar -->
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="url(#teknoRed)" stroke-width="4"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#teknoGold)" stroke-width="2"/>
  
  <!-- Mahkota Juara / Sayap Teknokrat -->
  <path d="M 22,62 C 28,45 38,36 50,32 C 62,36 72,45 78,62 C 66,54 58,54 50,58 C 42,54 34,54 22,62 Z" fill="url(#teknoRed)"/>
  
  <!-- Obor Pendidikan Emas -->
  <path d="M 45,34 L 55,34 L 52,58 L 48,58 Z" fill="url(#teknoGold)"/>
  <!-- Api Obor -->
  <path d="M 50,18 C 55,23 57,28 50,33 C 43,28 45,23 50,18 Z" fill="#ef4444"/>
  
  <!-- Buku Terbuka di Bawah -->
  <path d="M 32,68 Q 50,64 50,72 Q 50,64 68,68 L 68,76 Q 50,72 50,80 Q 50,72 32,76 Z" fill="url(#teknoGold)" stroke="#b45309" stroke-width="1"/>
  
  <!-- Inisial UTI -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#b91c1c" text-anchor="middle" letter-spacing="1.5">TEKNOKRAT</text>
</svg>
